# antislop — DSH skill plugin patch
#
# Registers an isolated dsh-skill-filesystem provider (providerName: "antislop")
# that scans only the skills/ directory inside this plugin. includeDefaultRoots
# is false so no project/user roots leak into this provider's catalog.
#
# Skill layout:
#   skills/core/SKILL.md        → name: antislop              (core filter)
#   skills/ui/SKILL.md          → name: antislop-ui           (visual/interface)
#   skills/copywriting/SKILL.md → name: antislop-copywriting  (prose/CTAs)
#   skills/human/SKILL.md       → name: antislop-human        (a11y/contrast/keyboard)
#   skills/responsive/SKILL.md  → name: antislop-responsive   (mobile breakpoints)
#   skills/code-comments/SKILL.md → name: antislop-code-comments (comment hygiene)
#
# Each SKILL.md carries YAML frontmatter (name, description, whenToUse) so
# dsh-skill-filesystem can parse it as a discoverable skill entry.
#
# Load order in the session:
#   1. This plugin injects the provider at CUSTOM_RANK (300).
#   2. The agent reads the core skill (antislop) on every session start.
#   3. Per-task, the matching subskill loads (ui / copywriting / human / responsive / code-comments).
- insert:
    - id: antislop-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: antislop
        includeDefaultRoots: false
        customSkillDirs:
          # EDIT THIS. Replace the path below with the absolute path to the
          # skills directory of your clone. dsh-skill-filesystem resolves this
          # value with resolve(), so a relative path lands against the DSH
          # process working directory and is not reliable. A wrong value fails
          # silently: the root contributes no candidates and the skills simply
          # do not appear.
          - /absolute/path/to/dsh-antislop/skills
        watch: false
